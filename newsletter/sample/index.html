  <!-- The desk's top bar, built by /js/shell-ui.js: these pages crumb under Newsletter. -->

  <main id="main" class="email-page">
    <div class="email-head">
      <div>
        <h1 class="home-title">Sample issue</h1>
        <p class="lede">A fictional issue with every kind of item, as the builder would send it.</p>
      </div>
      <div class="email-actions">
        <span class="email-status" role="status" aria-live="polite"></span>
        <button type="button" class="btn btn-primary email-copy" hidden>Copy HTML</button>
      </div>
    </div>
    <p class="email-note">The same sample the builder's Issue list offers to practice on. Every item in it is made up; nothing here is real. Drawn from the builder's template the moment this page opens.</p>
    <!-- The email, drawn by /js/email-page.js from the file named here through the builder's own template. -->
    <iframe class="email-sheet" title="Sample issue, as the email" data-issue="/builder/fixtures/practice-issue.json"></iframe>
  </main>
