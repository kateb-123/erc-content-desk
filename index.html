<body class="desk">
  <a class="skip-to-main" href="#main">Skip to content</a>
  <!-- The top bar: built by js/shell-ui.js from js/shell-view.js. -->
  <header class="topbar"></header>

  <div class="desk-main">
    <h1 class="sr-only">ERC Content Desk</h1>
    <p id="desk-status" class="status" role="status" aria-live="polite"></p>
    <main id="main">
      <section id="screen-home" class="screen"></section>
      <section id="screen-team" class="screen" hidden></section>
      <section id="screen-issue" class="screen" hidden></section>
      <section id="screen-schedule" class="screen" hidden></section>
      <section id="screen-past" class="screen" hidden></section>
      <section id="screen-sort" class="screen" hidden></section>
      <section id="screen-finalize" class="screen" hidden></section>
      <section id="screen-publish" class="screen" hidden></section>
    </main>
  </div>
