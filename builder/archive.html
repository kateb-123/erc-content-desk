<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Past newsletters · ERC Content Desk</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/tokens.css?v=2" />
  <link rel="stylesheet" href="/css/sidebar.css?v=5" />
  <style>
    /* The desk's names, which the shared sidebar reads; every value a Carbon token. */
    :root {
  /* The accent: teal (Kate, Sep 17, pick G). Carbon's blue tokens are remapped here; nothing else moves. */
  --accent-10: var(--teal-10); --accent-20: var(--teal-20); --accent-30: var(--teal-30); --accent-40: var(--teal-40);
  --accent-50: var(--teal-50); --accent-60: var(--teal-60); --accent-70: var(--teal-70); --accent-80: var(--teal-80);
  --accent-alpha: var(--teal-alpha);
  --button-primary: var(--accent-60); --button-primary-hover: var(--accent-70); --button-primary-active: var(--accent-80);
  --button-tertiary: var(--accent-60); --button-tertiary-hover: var(--accent-70); --button-tertiary-active: var(--accent-80);
  --link-primary: var(--accent-60); --link-primary-hover: var(--accent-70);
  --focus: var(--accent-60); --border-interactive: var(--accent-60); --interactive: var(--accent-60);
  --highlight: var(--accent-20); --notification-info-background: var(--accent-10); --notification-info-border: var(--accent-20); --support-info: var(--accent-70);
  --tag-background-blue: var(--accent-20); --tag-color-blue: var(--accent-80);
      --side-bg: var(--background); --ink: var(--text-primary); --muted: var(--text-secondary); --line: var(--border-subtle-00);
      --line-in: var(--border-subtle-01); --accent: var(--button-primary); --tint: var(--notification-info-background);
      --accent-deep: var(--button-primary-active); --selected: var(--highlight); --ok: var(--green-60); --hover: var(--accent-alpha); }
    /* The desk's sidebar stays open here, like Home (Kate, Sep 16). */
    body { margin: 0; background: var(--background); color: var(--text-primary); display: flex; min-height: 100vh;
      font-family: var(--font-sans); font-size: 14px; line-height: 20px; letter-spacing: .16px; }
    .page-main { flex: 1 1 auto; min-width: 0; }
    .wrap { max-width: 42rem; margin: 0 auto; padding: 44px var(--spacing-05) var(--spacing-10); }
    h1 { font-size: 28px; line-height: 36px; font-weight: 400; letter-spacing: 0; margin: 0 0 var(--spacing-02); }
    .lede { color: var(--text-secondary); margin: 0 0 var(--spacing-06); }
    /* The issues as Carbon's structured list on the first layer. */
    ul { list-style: none; margin: var(--spacing-06) 0 0; padding: 0; background: var(--layer-02); border: 1px solid var(--border-subtle-01); }
    li { border-top: 1px solid var(--border-subtle-01); }
    li:first-child { border-top: none; }
    li a { display: flex; align-items: center; min-height: 48px; padding: var(--spacing-03) var(--spacing-05); color: var(--text-primary); text-decoration: none;
      transition: background-color var(--duration-fast-01) var(--ease-productive); }
    li a:hover { background: var(--accent-10); }
    li a:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .empty { display: block; color: var(--text-secondary); padding: var(--spacing-07); text-align: center; }
    /* Sliding-dots loader, the same as the builder and the desk, on Carbon's blue ramp. */
    .dots-loader { position: relative; height: 20px; width: 250px; margin: var(--spacing-08) auto; }
    .dots-loader .dot { position: absolute; height: 20px; width: 20px; border-radius: var(--radius-round);
      border: 2px solid var(--background); box-sizing: border-box; animation: dots-slide 3s ease-in-out infinite; }
    .dots-loader .dot:nth-child(1) { background: var(--accent-30); animation-delay: .5s; }
    .dots-loader .dot:nth-child(2) { background: var(--accent-40); animation-delay: .4s; }
    .dots-loader .dot:nth-child(3) { background: var(--accent-50); animation-delay: .3s; }
    .dots-loader .dot:nth-child(4) { background: var(--accent-60); animation-delay: .2s; }
    .dots-loader .dot:nth-child(5) { background: var(--accent-70); animation-delay: .1s; }
    .dots-loader .dot:nth-child(6) { background: var(--accent-80); animation-delay: 0s; }
    @keyframes dots-slide {
      15% { transform: translateX(0); }
      45%, 65% { transform: translateX(230px); }
      95% { transform: translateX(0); }
    }
    .dots-caption { text-align: center; color: var(--text-secondary); padding-bottom: var(--spacing-07); }
    .dots-caption::after { content: ""; animation: dots-text 3s infinite; }
    @keyframes dots-text { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
    @media (prefers-reduced-motion: reduce) {
      .dots-loader .dot, .dots-caption::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <nav class="side" aria-label="Desk"></nav>
  <div class="page-main">
  <div class="wrap">
    <h1>Past newsletters</h1>
    <p class="lede">Every issue saved to the archive, newest first. Click one to read it.</p>
    <ul id="list"><li><div class="dots-loader" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="dots-caption">Loading</div></li></ul>
  </div>
  </div>
  <script type="module">
    import { renderSidebar } from '/js/sidebar-ui.js';
    renderSidebar(document.querySelector('.side'), { screen: 'past', isSectionWindow: false, onGo: () => {}, queueCount: null });
  </script>
  <script>
    fetch('newsletters/index.json', { cache: 'no-store' })
      .then((res) => res.json())
      .then((issues) => {
        const list = document.getElementById('list');
        list.innerHTML = '';
        if (!issues.length) {
          list.innerHTML = '<li><span class="empty">Nothing archived yet.</span></li>';
          return;
        }
        for (const issue of issues) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = 'newsletters/' + issue.file;
          a.textContent = issue.label;
          li.appendChild(a);
          list.appendChild(li);
        }
      })
      .catch(() => {
        document.getElementById('list').innerHTML = '<li><span class="empty">Couldn\'t load the archive.</span></li>';
      });
  </script>
</body>
</html>
