<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Past Newsletters — ERC Newsletter Builder</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&family=Outfit:wght@600;700&display=swap" />
  <style>
    body { margin: 0; background: #f3f5f8; color: #1f2430; line-height: 1.5;
      font-family: Karla, "Segoe UI", Helvetica, Arial, sans-serif; }
    .wrap { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
    h1 { font-family: Outfit, "Segoe UI", sans-serif; font-size: 1.35rem; margin: 0 0 .25rem; }
    .lede { color: #5a6270; margin: 0 0 1.5rem; }
    a.back { color: #1d6ea5; text-decoration: none; font-weight: 600; }
    ul { list-style: none; margin: 1.5rem 0 0; padding: 0; background: #fff; border: 1px solid #dfe2ea; border-radius: 12px; }
    li { border-top: 1px solid #eef0f3; }
    li:first-child { border-top: none; }
    li a { display: block; padding: .7rem 1rem; color: #1f2430; text-decoration: none; font-weight: 600; }
    li a:hover { background: #f4f8fb; }
    .empty { color: #5a6270; padding: 2rem; text-align: center; }
    /* Sliding-dots loader — same as the builder/desk, desk blues. */
    .dots-loader { position: relative; height: 20px; width: 250px; margin: 2.5rem auto; }
    .dots-loader .dot { position: absolute; height: 20px; width: 20px; border-radius: 100%;
      border: 2px solid #fff; box-sizing: border-box; animation: dots-slide 3s ease-in-out infinite; }
    .dots-loader .dot:nth-child(1) { background: #9ec9e8; animation-delay: .5s; }
    .dots-loader .dot:nth-child(2) { background: #63a3cd; animation-delay: .4s; }
    .dots-loader .dot:nth-child(3) { background: #4a8cbf; animation-delay: .3s; }
    .dots-loader .dot:nth-child(4) { background: #1d6ea5; animation-delay: .2s; }
    .dots-loader .dot:nth-child(5) { background: #19608f; animation-delay: .1s; }
    .dots-loader .dot:nth-child(6) { background: #14507a; animation-delay: 0s; }
    @keyframes dots-slide {
      15% { transform: translateX(0); }
      45%, 65% { transform: translateX(230px); }
      95% { transform: translateX(0); }
    }
    .dots-caption { text-align: center; color: #5a6270; padding-bottom: 2rem; }
    .dots-caption::after { content: ""; animation: dots-text 3s infinite; }
    @keyframes dots-text { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
    @media (prefers-reduced-motion: reduce) {
      .dots-loader .dot, .dots-caption::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="./">← Back to the builder</a>
    <h1 style="margin-top: 1rem;">Past newsletters</h1>
    <p class="lede">Every issue saved to the archive, newest first. Click one to read it.</p>
    <ul id="list"><li><div class="dots-loader" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="dots-caption">Loading</div></li></ul>
  </div>
  <script>
    fetch('newsletters/index.json', { cache: 'no-store' })
      .then((res) => res.json())
      .then((issues) => {
        const list = document.getElementById('list');
        list.innerHTML = '';
        if (!issues.length) {
          list.innerHTML = '<li><span class="empty">Nothing archived yet.</span></li>';
          return;
        }
        for (const issue of issues) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = 'newsletters/' + issue.file;
          a.textContent = issue.label;
          li.appendChild(a);
          list.appendChild(li);
        }
      })
      .catch(() => {
        document.getElementById('list').innerHTML = '<li><span class="empty">Couldn\'t load the archive.</span></li>';
      });
  </script>
</body>
</html>
