<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERC Newsletter Builder</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/styles.css?v=34" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <h1>ERC Newsletter Builder</h1>
      <a class="archive-link" href="archive.html">View past newsletters</a>
    </div>
  </header>

  <nav class="step-nav" aria-label="Wizard steps">
    <ol class="step-list">
      <li class="step-indicator" data-nav-step="review">Review</li>
      <li class="step-indicator" data-nav-step="triage">Outline</li>
      <li class="step-indicator" data-nav-step="edit">Preview &amp; Edit</li>
      <li class="step-indicator" data-nav-step="export">Save &amp; Export</li>
    </ol>
  </nav>

  <main class="wizard-body">
    <section data-step="review" class="wizard-step">
      <h2>Review</h2>
    </section>

    <section data-step="triage" class="wizard-step" hidden>
      <h2>Outline</h2>
    </section>

    <section data-step="edit" class="wizard-step" hidden>
      <h2>Preview &amp; Edit</h2>
    </section>

    <section data-step="export" class="wizard-step" hidden>
      <h2>Save &amp; Export</h2>
    </section>
  </main>

  <footer class="wizard-footer">
    <button id="btn-back" class="btn btn-secondary" disabled><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back</button>
    <button id="btn-next" class="btn btn-primary">Next <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
  </footer>

  <!-- Bump ?v when you change the JS so browsers load the new code (cache-busting). -->
  <script type="module" src="js/app.js?v=26"></script>
</body>
</html>
