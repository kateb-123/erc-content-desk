<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter builder · ERC Content Desk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css?v=5" />
  <link rel="stylesheet" href="/css/shell.css?v=1" />
  <link rel="stylesheet" href="css/styles.css?v=52" />
</head>
<body>
  <a class="skip-to-main" href="#main">Skip to content</a>
  <!-- The desk's top bar, built by /js/shell-ui.js: the breadcrumb puts the
       builder under Newsletter. -->
  <header class="topbar"></header>

  <div class="builder-main">
  <div class="builder-head"><h1>Newsletter builder</h1></div>

  <nav class="step-nav" aria-label="Wizard steps">
    <ol class="step-list">
      <!-- The li draws the circle and the line; the button inside is the control. -->
      <li class="step-indicator" data-nav-step="review"><button type="button" class="step-btn">Review</button></li>
      <li class="step-indicator" data-nav-step="triage"><button type="button" class="step-btn">Outline</button></li>
      <li class="step-indicator" data-nav-step="edit"><button type="button" class="step-btn">Preview &amp; Edit</button></li>
      <li class="step-indicator" data-nav-step="export"><button type="button" class="step-btn">Save &amp; Export</button></li>
    </ol>
  </nav>
  <!-- The one-line status slot under the step row: what a locked step or Next says before anything is pulled. -->
  <p id="wizard-status" class="wizard-status" role="status" aria-live="polite"></p>

  <!-- Each step's renderer opens with the heading a screen reader reads, taken
       from the step row's own words; on screen the step row names it and the
       step opens with a lede. -->
  <main id="main" class="wizard-body">
    <section data-step="review" class="wizard-step"></section>
    <section data-step="triage" class="wizard-step" hidden></section>
    <section data-step="edit" class="wizard-step" hidden></section>
    <section data-step="export" class="wizard-step" hidden></section>
  </main>

  <!-- Back is Carbon's secondary; Next is the tertiary door, like Go to Finalize. -->
  <footer class="wizard-footer">
    <button id="btn-back" class="btn btn-secondary" disabled><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back</button>
    <button id="btn-next" class="btn btn-tertiary">Next <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
  </footer>
  </div>

  <!-- Bump ?v when you change the JS so browsers load the new code (cache-busting). -->
  <script type="module" src="js/app.js?v=40"></script>
</body>
</html>
