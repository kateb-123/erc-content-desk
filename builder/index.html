<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter builder · ERC Content Desk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css?v=2" />
  <link rel="stylesheet" href="/css/sidebar.css?v=8" />
  <link rel="stylesheet" href="css/styles.css?v=46" />
</head>
<body class="builder-shell">
  <a class="skip-to-main" href="#main">Skip to content</a>
  <!-- The desk's sidebar, tucked behind a thin strip like Desk work (Kate, Sep 16):
       built by /js/sidebar-ui.js. Past newsletters, the Policy Exchange and the
       desk live in it; the header that carried them is gone. -->
  <nav class="side" aria-label="Desk"></nav>

  <div class="builder-main">
  <div class="builder-head"><h1>Newsletter builder</h1></div>

  <nav class="step-nav" aria-label="Wizard steps">
    <ol class="step-list">
      <!-- The li draws the circle and the line; the button inside is the control (b22). -->
      <li class="step-indicator" data-nav-step="review"><button type="button" class="step-btn">Review</button></li>
      <li class="step-indicator" data-nav-step="triage"><button type="button" class="step-btn">Outline</button></li>
      <li class="step-indicator" data-nav-step="edit"><button type="button" class="step-btn">Preview &amp; Edit</button></li>
      <li class="step-indicator" data-nav-step="export"><button type="button" class="step-btn">Save &amp; Export</button></li>
    </ol>
  </nav>
  <!-- The one-line status slot under the step row: what a locked step or Next says before anything is pulled (b23, e29). -->
  <p id="wizard-status" class="wizard-status" role="status" aria-live="polite"></p>

  <!-- Each step's heading is for a screen reader; the step row names it on screen and the card opens with a lede (e35). -->
  <main id="main" class="wizard-body">
    <section data-step="review" class="wizard-step">
      <h2 class="sr-only">Review</h2>
    </section>

    <section data-step="triage" class="wizard-step" hidden>
      <h2 class="sr-only">Outline</h2>
    </section>

    <section data-step="edit" class="wizard-step" hidden>
      <h2 class="sr-only">Preview &amp; Edit</h2>
    </section>

    <section data-step="export" class="wizard-step" hidden>
      <h2 class="sr-only">Save &amp; Export</h2>
    </section>
  </main>

  <!-- Back is Carbon's secondary; Next is the tertiary door, like Go to Finalize (e32). -->
  <footer class="wizard-footer">
    <button id="btn-back" class="btn btn-secondary" disabled><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back</button>
    <button id="btn-next" class="btn btn-tertiary">Next <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
  </footer>
  </div>

  <!-- Bump ?v when you change the JS so browsers load the new code (cache-busting). -->
  <script type="module" src="js/app.js?v=35"></script>
</body>
</html>
